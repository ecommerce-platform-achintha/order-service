server:
  port: 8083

spring:
  application:
    name: order-service
  config:
    # "optional:" lets the service start even when the Config Server is down.
    # Override with CONFIG_SERVER_URL, e.g. inside Docker where localhost is the container.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    # Defaults match docker-compose.yml (orderdb on host port 5434), next to user-service (5432) and product-service (5433).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:orderdb}
    username: ${DB_USERNAME:orderservice}
    password: ${DB_PASSWORD:orderservice}
  jpa:
    # Temporary: schema managed by Hibernate until Flyway/Liquibase migrations are introduced.
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        # Plain JSON with its own "eventType" discriminator; no Java class name header for consumers to depend on
        spring.json.add.type.headers: false
        # Events are notifications, not prerequisites: if the broker is unreachable, send() gives up after 1s
        # (Kafka's default is 60s, which would stall the order request) and delivery fails after 10s, not 2min.
        max.block.ms: 1000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  cloud:
    openfeign:
      client:
        config:
          product-service:
            connect-timeout: 1000
            # Backstop only: the 3s TimeLimiter below normally fires first
            read-timeout: 4000

order-service:
  kafka:
    # All order status changes go to this one topic, keyed by orderId
    order-events-topic: order-events

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Resilience for calls to product-service (see ProductServiceGateway). Each call runs as
# Retry(CircuitBreaker(TimeLimiter(call))): every attempt gets its own timeout and is counted by the breaker.
resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 100
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # product-service answered, just "no": not a sign it is unhealthy
        ignore-exceptions:
          - com.achintha.orderservice.exception.NotFoundException
          - com.achintha.orderservice.exception.InsufficientStockException
  retry:
    instances:
      productLookup:
        max-attempts: 2
        wait-duration: 300ms
        ignore-exceptions:
          - com.achintha.orderservice.exception.NotFoundException
          - com.achintha.orderservice.exception.InsufficientStockException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      inventoryUpdate:
        max-attempts: 2
        wait-duration: 300ms
        # A decrement isn't idempotent: only retry when the request never reached product-service
        retry-exception-predicate: com.achintha.orderservice.product.ConnectFailurePredicate
        ignore-exceptions:
          - com.achintha.orderservice.exception.NotFoundException
          - com.achintha.orderservice.exception.InsufficientStockException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  timelimiter:
    instances:
      productService:
        timeout-duration: 3s
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        # circuitbreakers / circuitbreakerevents show the product-service breaker's state and recent calls
        include: health,info,circuitbreakers,circuitbreakerevents

springdoc:
  swagger-ui:
    path: /swagger-ui.html
