# Runs order-service + its PostgreSQL database.
#
# Config Server (8888), Eureka (8761) and product-service (8082) are expected to be running on the host
# (see README); the container reaches Config Server and Eureka via host.docker.internal, and finds
# product-service through Eureka.
#
# The database is published on host port 5434 (user-service uses 5432, product-service 5433), so all
# stacks can run at the same time. Kafka (single-node KRaft, no ZooKeeper) is published on 9092.
#
#   docker compose up --build               # service + DB + Kafka
#   docker compose up -d postgres kafka     # infra only, then run the app with mvn spring-boot:run

services:
  postgres:
    image: postgres:17-alpine
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-orderdb}
      POSTGRES_USER: ${DB_USERNAME:-orderservice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderservice}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - order-service-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.0
    container_name: order-service-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST: for clients on the host (localhost:9092); DOCKER: for containers on this network (kafka:29092)
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # order-events is auto-created on first publish, with 3 partitions (events are keyed by orderId)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - order-service-kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  order-service:
    build: .
    image: order-service:latest
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-orderdb}
      DB_USERNAME: ${DB_USERNAME:-orderservice}
      DB_PASSWORD: ${DB_PASSWORD:-orderservice}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL:-http://host.docker.internal:8888}
      EUREKA_URL: ${EUREKA_URL:-http://host.docker.internal:8761/eureka/}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      # Register as localhost:8083 (the published port) rather than the container's internal IP
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: localhost

volumes:
  order-service-pgdata:
  order-service-kafkadata:
